name: Build mod

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract mod ZIP
        run: |
          unzip -o voicehunter.zip -d mod

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find project
        run: |
          PROJECT_DIR=$(dirname "$(find mod -name build.gradle -type f -print -quit)")

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "ERRO: gradlew não encontrado!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build mod
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew build --info --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: voicehunter-jar
          path: mod/**/build/libs/*.jar
          if-no-files-found: error
