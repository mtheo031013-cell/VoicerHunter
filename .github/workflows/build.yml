name: Build mod

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract mod ZIP
        run: |
          unzip -o voicehunter.zip -d mod

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          cd mod/voicehunter/voicehunter
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Upload the mod jar
        uses: actions/upload-artifact@v4
        with:
          name: voicehunter-jar
          path: mod/voicehunter/voicehunter/build/libs/*.jar
          
