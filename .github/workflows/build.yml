name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Unpack project
        run: |
          mkdir project
          unzip -q voicehunter-forge.zip -d project
          G=$(find project -name gradlew | head -1)
          echo "DIR=$(dirname "$G")" >> "$GITHUB_ENV"
      - name: Build
        run: |
          cd "$DIR"
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace
      - name: Collect jar
        run: |
          mkdir out
          cp "$DIR"/build/libs/*.jar out/
      - uses: actions/upload-artifact@v4
        with:
          name: voicehunter-forge-jar
          path: out/*.jar
